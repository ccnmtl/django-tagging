[buildout]
extends                 = versions.cfg
parts                   = test
                          flake8
                          evolution
develop                 = .
eggs                    = django
                          django-tagging
show-picked-versions    = true

[test]
recipe                  = zc.recipe.egg
eggs                    = pytest
                          pytest-django
                          ${buildout:eggs}
entry-points            = test=pytest:console_main
initialization          = import os
                          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'tagging.tests.settings')

[flake8]
recipe                  = zc.recipe.egg
eggs                    = flake8

[evolution]
recipe                  = zc.recipe.egg
eggs                    = buildout-versions-checker
arguments               = '-w --sorting alpha'
scripts                 = check-buildout-updates=${:_buildout_section_name_}
